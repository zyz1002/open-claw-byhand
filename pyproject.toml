[project]
name = "open-claw-byhand"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "aiohttp>=3.9",
    "apscheduler>=3.10,<4.0",
    "chromadb>=0.5",
    "claude-agent-sdk>=0.1.31",
    "claude-code-sdk>=0.0.25",
    "croniter>=6.0.0",
    "feedparser>=6.0",
    "openai>=1.0",
    "python-dotenv>=1.2.1",
    "qq-botpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanoclaw"]

[tool.ruff]
line-length = 180
